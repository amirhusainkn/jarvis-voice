<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Voice Assistant</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .mic-btn {
            background-color: #00d2ff;
            color: #000;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            margin-top: 30px;
        }
        .status {
            margin-top: 20px;
            font-size: 18px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <h1>JARVIS AI</h1>
    <div class="status" id="statusText">Tap karke baat karein...</div>
    <button class="mic-btn" onclick="startJarvis()">🎙️ Tap to Speak</button>

    <script>
        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'hi-IN';
            speech.rate = 1.0;
            window.speechSynthesis.speak(speech);
        }

        window.onload = function() {
            speak("Aamir bhai, Jarvis apke khidmat mein hazir hai. Boliye, aaj kya hukum hai?");
        }

        function startJarvis() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Aapka browser ya device ise support nahi karta!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';

            document.getElementById("statusText").innerText = "Suna ja raha hai... boliye!";

            recognition.onresult = function(event) {
                const userSpeech = event.results[0][0].transcript.toLowerCase();
                document.getElementById("statusText").innerText = "Aapne kaha: " + userSpeech;

                // Smart Keyword Check (Chahe Hindi mein ho ya Roman mein, yeh pakad lega)
                if (userSpeech.includes("time") || userSpeech.includes("samay") || userSpeech.includes("baje") || userSpeech.includes("kitna") || userSpeech.includes("тайм") || userSpeech.includes("टime")) {
                    const now = new Date();
                    let hours = now.getHours();
                    let minutes = now.getMinutes();
                    hours = hours % 12;
                    hours = hours ? hours : 12;
                    speak("Aamir bhai, abhi " + hours + " baj kar " + minutes + " minute ho rahe hain.");
                }
                else if (userSpeech.includes("din") || userSpeech.includes("vaar") || userSpeech.includes("aaj") || userSpeech.includes("day")) {
                    const hindiDays = ["Ravivar", "Somwar", "Mangalwar", "Budhwar", "Jumerat", "Juma", "Sanichar"];
                    const today = new Date().getDay();
                    speak("Aamir bhai, aaj " + hindiDays[today] + " hai.");
                }
                else if (userSpeech.includes("hello") || userSpeech.includes("salam") || userSpeech.includes("kaise ho")) {
                    speak("Salam Aamir bhai! Main ekdum fit hoon, aap bataiye aap kaise hain?");
                }
                else if (userSpeech.includes("thank") || userSpeech.includes("shukriya")) {
                    speak("Aapka shukriya ada karne ki zaroorat nahi hai Aamir bhai.");
                }
                else {
                    speak("Aapne kaha: " + userSpeech + ". Yeh baat maine samajh li hai Amir bhai.");
                }
            };

            recognition.onerror = function(event) {
                document.getElementById("statusText").innerText = "Awaaz sunne mein dikkat aayi, dobara koshish karein.";
            };

            recognition.start();
        }
    </script>

</body>
</html>
